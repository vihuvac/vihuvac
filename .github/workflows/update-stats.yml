name: Waka Readme

on:
  schedule:
    # Runs at minute 0 every 2 hours (00:00, 02:00, 04:00, etc.).
    - cron: "0 */2 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

  # Runs on any PR targeting main (not just direct pushes).
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/update-stats.yml"
      - "README.md"

jobs:
  update-readme:
    name: Update Readme with Metrics
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Checks out the PR branch dynamically on pull_request, or the target branch on push/schedule.
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Target dynamic branch for read and write.
          PULL_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PUSH_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

          # Visual & Bar Styling.
          BAR_STYLE: "svg"
          BAR_COLOR: "#90CAF9"
          BAR_TRACK_COLOR: "#172f45"
          BAR_RADIUS: "4"
          TEXT_PRIMARY_COLOR: "#c9d1d9"
          TEXT_SECONDARY_COLOR: "#8b949e"

          # Target section in README.md (<!--START_SECTION:waka--> ... <!--END_SECTION:waka-->)
          SECTION_NAME: "waka"

          # Language display settings.
          SHOW_LANGUAGE: "True"
          # LANG_COUNT: "10"

          # Disable extra sections to keep clean language-only stats.
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
          SHOW_EDITORS: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_TIMEZONE: "False"
          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_LOC_CHART: "False"
          SHOW_TOTAL_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
          SHOW_AI_CODE_TIME: "False"
